name: Build & Release

# Push a tag like v1.0.1 to trigger a build on all three OSes and publish a
# GitHub Release. electron-updater in the app reads these releases to update.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # lets you re-run a build manually from the Actions tab

permissions:
  contents: write   # required so the GITHUB_TOKEN can create the Release

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Export signing/notarization vars ONLY when the matching secrets exist.
      # (Passing an empty CSC_LINK makes electron-builder try to sign and fail,
      # so unsigned builds must leave these completely unset.)
      - name: Configure code signing (if secrets are set)
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_PW_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK_SECRET: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_SECRET: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$CSC_LINK_SECRET" ]; then
            { echo "CSC_LINK<<__EOF__"; echo "$CSC_LINK_SECRET"; echo "__EOF__"; } >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_ID_SECRET" ]; then
            echo "APPLE_ID=$APPLE_ID_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_PW_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET" >> "$GITHUB_ENV"
          fi
          if [ -n "$WIN_CSC_LINK_SECRET" ]; then
            { echo "WIN_CSC_LINK<<__EOF__"; echo "$WIN_CSC_LINK_SECRET"; echo "__EOF__"; } >> "$GITHUB_ENV"
            echo "WIN_CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
