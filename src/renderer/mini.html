<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' cdmedia: data:;" />
  <title>Countdown</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff; overflow: hidden; user-select: none; background: var(--accent, #5b8cff);
    }
    .wrap { height: 100%; display: flex; flex-direction: column; padding: 11px 13px 9px;
      background: linear-gradient(160deg, rgba(0,0,0,0.12), rgba(0,0,0,0.45)); }
    /* Only the title strip drags the window, so the body still receives wheel/scroll. */
    .top { display: flex; align-items: center; gap: 7px; -webkit-app-region: drag; }
    .timer, .foot { -webkit-app-region: no-drag; }
    .icon { font-size: 15px; flex: none; }
    .icon img { width: 18px; height: 18px; border-radius: 4px; object-fit: cover; vertical-align: middle; }
    .title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .close { -webkit-app-region: no-drag; cursor: pointer; background: rgba(255,255,255,0.2); border: none; color: #fff; border-radius: 6px; width: 22px; height: 22px; font-size: 13px; }
    .timer { flex: 1; display: flex; align-items: center; justify-content: center; gap: 9px; }
    .u { text-align: center; }
    .n { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
    .l { font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.85; margin-top: 3px; }
    .empty { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; opacity: 0.85; }
    .foot { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .dots { display: flex; gap: 4px; }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.4); }
    .dot.on { background: #fff; }
    /* progress bar (matches app settings) */
    .pbar { flex: 1; height: var(--progress-h, 8px); background: rgba(255,255,255,0.25); }
    .pfill { height: 100%; width: 0%; background: var(--progress-color, #fff); transition: width 0.5s ease; }
    body[data-progress="rounded"] .pbar, body[data-progress="striped"] .pbar, body[data-progress="glow"] .pbar, body[data-progress="sweep"] .pbar { border-radius: 999px; overflow: hidden; }
    body[data-progress="rounded"] .pfill, body[data-progress="striped"] .pfill, body[data-progress="glow"] .pfill, body[data-progress="sweep"] .pfill { border-radius: 999px; }
    body[data-progress="striped"] .pfill { background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.18) 0 8px, transparent 8px 16px); background-size: 22px 22px; animation: s 0.8s linear infinite; }
    @keyframes s { from { background-position: 0 0; } to { background-position: 22px 0; } }
    body[data-progress="glow"] .pfill { box-shadow: 0 0 8px 1px var(--progress-color, #fff); animation: g 1.6s ease-in-out infinite; }
    @keyframes g { 0%,100% { filter: brightness(0.85); } 50% { filter: brightness(1.3); } }
    body[data-progress="sweep"] .pfill { background: linear-gradient(90deg, var(--progress-color,#fff), rgba(255,255,255,0.5), var(--progress-color,#fff)); background-size: 220% 100%; animation: w 2.2s linear infinite; }
    @keyframes w { from { background-position: 220% 0; } to { background-position: -220% 0; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <span class="icon" id="icon"></span>
      <div class="title" id="title">—</div>
      <button class="close" id="close" title="Close">✕</button>
    </div>
    <div class="timer" id="timer"></div>
    <div class="foot">
      <div class="pbar"><div class="pfill" id="pfill"></div></div>
      <div class="dots" id="dots"></div>
    </div>
  </div>
  <script src="mini.js"></script>
</body>
</html>
