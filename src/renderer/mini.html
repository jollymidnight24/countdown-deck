<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>Countdown</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff; overflow: hidden; user-select: none;
      background: var(--accent, #5b8cff);
    }
    .wrap { height: 100%; display: flex; flex-direction: column; padding: 12px 14px;
      background: linear-gradient(160deg, rgba(0,0,0,0.15), rgba(0,0,0,0.45)); -webkit-app-region: drag; }
    .top { display: flex; align-items: center; gap: 8px; }
    .title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .close { -webkit-app-region: no-drag; cursor: pointer; background: rgba(255,255,255,0.2);
      border: none; color: #fff; border-radius: 6px; width: 22px; height: 22px; font-size: 13px; }
    .timer { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .u { text-align: center; }
    .n { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
    .l { font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.85; margin-top: 3px; }
    .empty { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; opacity: 0.85; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="title" id="title">—</div>
      <button class="close" id="close" title="Close">✕</button>
    </div>
    <div class="timer" id="timer"></div>
  </div>
  <script src="mini.js"></script>
</body>
</html>
